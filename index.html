<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM DAY 1</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="q1">
      <p>Hello</p>
      <button class="q1-btn">DOM</button>
    </div>

    <div class="q2">
      <div class="q2-box"></div>
      <button class="q2-btn">Change</button>
    </div>

    <div class="q3">
      <div class="q3-box"></div>
      <button class="q3-btn">INVISIBLE</button>
    </div>

    <div class="q4">
      <div class="q4-box">
        <p class="rotate">Rotate</p>
      </div>

      <div class="q-4-bottom">
        <button class="q4-left-btn">LEFT</button>
        <button class="q4-right-btn">RIGHT</button>
      </div>
    </div>
    <div class="q5">
      <div class="q5-box">Number</div>
      <button class="btn-increment">Increment</button>
      <button class="btn-decrement">Decrement</button>
    </div>
    <div class="page1">
      <button class="q6-btn">Change Mode</button>
    </div>
    <div class="q7">
      <input class="q7-text" type="text" placeholder="Enter Text............" />
      <p class="q7-p"></p>
    </div>
    <div class="q8">
      <div class="q8-box"></div>
    </div>
    <div class="q9">
      <div class="q9-box">
        <p class="q9-box-p"></p>
        <button class="q9-btn">Click</button>
      </div>
    </div>
    <div class="q10">
      <div class="q10-box">
        <div class="red"></div>
        <div class="yellow"></div>
        <div class="green"></div>
      </div>
     </div>
   <div class="btn-class">
    <button class="red-btn">Red</button>
      <button class="yellow-btn">Yellow</button>
      <button class="green-btn">Green</button>
   </div>
    <script src="script.js"></script>
  </body>
</html>
