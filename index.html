<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM DAY-2</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="main">

      <div class="q1"></div>

      <div class="q2">
        <button class="q2-btn">Create Element</button>
      </div>

      <div class="q3">
        <div class="q3-box"></div>
        <input
          class="q3-input"
          type="number"
          placeholder="Enter Number 0-50"
          minlength="0"
          maxlength="50"
        />
      </div>

      <div class="q4">
        <div class="q4-inner"></div>
        <button class="q4-btn">Change</button>
      </div>

      <div class="q5">
        <div class="q5-box">
          <div class="q5-box-inner">
            <div class="q5-box-outer"></div>
          </div>
        </div>
        <button class="q5-btn">Progress</button>
      </div>

      <div class="q6">
        <div class="q6-box"></div>
        <button class="q6-btn">Create Box</button>
      </div>

      <div class="main-container">
        <div class="slot-machine">
          <div class="numbers">
            <div class="num" id="num1">0</div>
            <div class="num" id="num2">0</div>
            <div class="num" id="num3">0</div>
          </div>

          <button id="spinBtn">Spin</button>

          <h2 id="result"></h2>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
